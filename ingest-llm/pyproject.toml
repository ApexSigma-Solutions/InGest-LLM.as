[tool.poetry]
name = "ingest-llm"
version = "0.1.0"
description = "The Stomach: Raw data ingestion and sanitization"
authors = ["ApexSigma Solutions"]
readme = "README.md"
license = "MIT"
packages = [{include = "ingest_llm"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {version = "^0.27.0"}
pydantic = "^2.5.0"
neo4j = "^5.14"
asyncpg = "^0.29"
python-dotenv = "^1.0"
httpx = "^0.26.0"
prometheus-client = "^0.20.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.3"
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
