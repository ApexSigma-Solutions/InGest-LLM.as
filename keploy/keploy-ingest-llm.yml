# keploy-ingest-llm.yml
version: api/v1beta1
kind: config
metadata:
  name: keploy-ingest-llm-config
spec:
  path: "./keploy-tests"
  command: "python -m uvicorn src.ingest_llm_as.main:app --host 0.0.0.0 --port 8000"
  network:
    filterNoise: true
    delay: 10
  test:
    path: "./keploy-tests/tests"
    command: "python -m pytest tests/ -v"
    delay: 5