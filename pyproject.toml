[tool.poetry]
name = "ingest-llm-as"
version = "0.1.0"
description = "A microservice for ingesting data into the ApexSigma ecosystem."
license = "MIT"
authors = ["SigmaDev11 <steynsean11@gmail.com>"]
readme = "README.md"
packages = [{include = "ingest_llm_as", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.112.0"
uvicorn = {extras = ["standard"], version = "^0.30.3"}
pydantic-settings = "^2.3.4"
pydantic = "^2.8.0"
prometheus-client = "^0.19.0"
prometheus-fastapi-instrumentator = "^6.1.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-exporter-jaeger-thrift = "^1.21.0"
opentelemetry-instrumentation-httpx = "^0.48b0"
structlog = "^24.2.0"
langfuse = "^3.4.0"
openai = "^1.35.0"
numpy = "^2.0.0"
poml = ">=0.0.7,<0.0.8"
deprecated = "^1.2.14"
defusedxml = "^0.7.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5.0"
mypy = "^1.10.0"
pytest = "^8.2.2"
pytest-cov = "^4.1.0"
pytest-asyncio = "^1.1.0"
coverage = {extras = ["toml"], version = "^7.4.0"}
httpx = "^0.27.0"
pre-commit = "^3.7.1"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=ingest_llm_as",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests"
]

[tool.coverage.run]
source = ["src/ingest_llm_as"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/venv/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = "^0.25.0"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
